<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Save the Date — Pop the Reveal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF6F0;
      --ink-primary: #3D2E29;
      --ink-muted: #7C6A63;
      --accent-rose: #B56557;
      --accent-rose-hover: #9E5245;
      --border-soft: #E5D9CD;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--ink-primary);
      background-image:
        radial-gradient(circle at 12% 15%, rgba(181, 101, 87, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 88% 85%, rgba(196, 164, 132, 0.14) 0%, transparent 50%);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .font-serif-romantic {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Fotolijst container */
    .reveal-frame {
      background: #EFE6DC;
      border: 6px solid #FFFFFF;
      box-shadow:
        0 20px 45px -12px rgba(61, 46, 41, 0.22),
        0 4px 14px -2px rgba(61, 46, 41, 0.10);
      border-radius: 1.25rem;
      position: relative;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    #revealCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    #fireworksCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
    }

    .btn-warm {
      transition: all 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-warm:active {
      transform: scale(0.97);
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-reveal {
      animation: fadeSlideUp 550ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center justify-center p-3 sm:p-5">

  <!-- Schermvullende Vuurwerklaag -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Centrale Pop the Reveal Sectie -->
  <main class="w-full max-w-2xl flex flex-col items-center gap-3.5 relative z-10">

    <!-- Speelveld Wrapper -->
    <div id="revealContainer" class="reveal-frame w-full mx-auto" style="aspect-ratio: 669 / 447;">
      <canvas id="revealCanvas"></canvas>

      <!-- Laadstatus / Bestandskiezer fallback -->
      <div id="loadingState" class="absolute inset-0 flex flex-col items-center justify-center bg-[#EFE6DC] text-[#7C6A63] gap-2 z-20">
        <div class="w-8 h-8 border-2 border-[#B56557] border-t-transparent rounded-full animate-spin"></div>
        <span class="text-sm font-medium">Bubbeltjes en hartjes blazen...</span>
      </div>
    </div>

    <!-- Feestelijke Onthullingskaart (verschijnt zodra alles weggeprikt is) -->
    <div id="celebrationBanner" class="hidden w-full bg-white border border-[#E5D9CD] rounded-2xl p-5 sm:p-6 text-center shadow-md animate-reveal">
      <h2 class="font-serif-romantic text-2xl sm:text-3xl font-bold text-[#3D2E29]">
        Save the date: 18-08-2028!
      </h2>
      <p class="text-sm text-[#7C6A63] mt-1">
        Alle bubbels en hartjes zijn uiteengespat — zet deze mooie dag alvast in je agenda!
      </p>
      <div class="mt-4">
        <button type="button" id="playAgainBtn" class="btn-warm inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#B56557] hover:bg-[#9E5245] text-white text-sm font-medium shadow-sm">
          Nog een keer spatten
        </button>
      </div>
    </div>

  </main>

  <script>
    /**
     * Save the Date — Pop the Reveal
     * Een dichte wolk van glinsterende zeepbellen en romantische hartjes verbergt de foto.
     * Bij elke tik of veeg spat een bubbel of hartje uiteen en licht het stukje foto erachter op.
     */
    (function () {
      const CANDIDATE_SOURCES = [
        'Savethedate.png',
        'savethedate.png',
        'Savethedate.jpg',
        'Savethedate_2.jpg',
        'savethedate.jpg'
      ];

      // Warme, pastel- en goudtinten voor de bubbels en hartjes
      const PALETTES = [
        { fill: '#F7D6D0', stroke: '#FFFFFF', glow: '#E8A598' }, // Zacht blush roze
        { fill: '#F3DFC1', stroke: '#FFFFFF', glow: '#D9B98E' }, // Warm champagne goud
        { fill: '#E8C5C1', stroke: '#FFF7F5', glow: '#C98A82' }, // Oudroze
        { fill: '#FCEADE', stroke: '#FFFFFF', glow: '#E6C2A5' }, // Perzik crème
        { fill: '#D8E2DC', stroke: '#FFFFFF', glow: '#A8BEB2' }  // Zacht saliegroen
      ];

      // DOM-elementen
      const revealContainer = document.getElementById('revealContainer');
      const canvas = document.getElementById('revealCanvas');
      const ctx = canvas.getContext('2d');
      const fwCanvas = document.getElementById('fireworksCanvas');
      const fwCtx = fwCanvas.getContext('2d');
      const loadingStateEl = document.getElementById('loadingState');
      const celebrationBannerEl = document.getElementById('celebrationBanner');
      const playAgainBtn = document.getElementById('playAgainBtn');

      // Offscreen maskercanvas: houdt bij welke delen van de foto nog bedekt zijn
      const maskCanvas = document.createElement('canvas');
      const maskCtx = maskCanvas.getContext('2d');

      // Spelstatus
      const bgImage = new Image();
      let imageLoaded = false;
      let width = 800;
      let height = 534;
      let fwWidth = window.innerWidth;
      let fwHeight = window.innerHeight;

      let bubbles = [];     // { id, baseX, baseY, x, y, r, type, palette, phase, speed, popped, popAnim }
      let particles = [];   // Spat-deeltjes en mini-hartjes bij het knappen
      let rings = [];       // Uitdijende schokgolfjes bij een tik
      let rockets = [];     // Opstijgende vuurpijlen
      let fwSparks = [];    // Uiteenspattende vuurwerkboeketten en vonken
      let fireworkTimer = null;
      let isWon = false;
      let isPointerDown = false;
      let animFrameId = null;
      let startTime = performance.now();

      /**
       * Start de applicatie en zoekt de Save the Date-afbeelding.
       */
      function init() {
        resizeFireworksCanvas();
        let sourceIndex = 0;

        bgImage.onload = () => {
          imageLoaded = true;
          if (bgImage.naturalWidth && bgImage.naturalHeight) {
            revealContainer.style.aspectRatio = `${bgImage.naturalWidth} / ${bgImage.naturalHeight}`;
          }
          loadingStateEl.classList.add('hidden');
          setupReveal();
          if (!animFrameId) {
            loop();
          }
        };

        bgImage.onerror = () => {
          sourceIndex++;
          if (sourceIndex < CANDIDATE_SOURCES.length) {
            bgImage.src = CANDIDATE_SOURCES[sourceIndex];
            return;
          }
          showFileUploadFallback();
        };

        bgImage.src = CANDIDATE_SOURCES[0];
        bindEvents();
      }

      /**
       * Toont een directe bestandskiezer als de preview niet bij lokale bestanden kan.
       */
      function showFileUploadFallback() {
        loadingStateEl.innerHTML = `
          <label for="localPhotoInput" class="w-full h-full flex flex-col items-center justify-center p-6 text-center cursor-pointer hover:bg-[#E7DDD2] transition-colors">
            <span class="px-5 py-2.5 rounded-xl bg-[#B56557] hover:bg-[#9E5245] text-white text-sm font-medium shadow-sm">
              Kies Savethedate.png of .jpg
            </span>
            <span class="text-xs text-[#7C6A63] mt-2">
              Of sleep de foto hierheen om te spelen
            </span>
            <input id="localPhotoInput" type="file" accept="image/*" class="hidden" />
          </label>
        `;

        const fileInput = document.getElementById('localPhotoInput');
        if (fileInput) {
          fileInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (file) loadImageFromFile(file);
          });
        }

        revealContainer.addEventListener('dragover', (e) => e.preventDefault());
        revealContainer.addEventListener('drop', (e) => {
          e.preventDefault();
          const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (file) loadImageFromFile(file);
        });
      }

      /**
       * Laadt een lokaal gekozen afbeelding in.
       */
      function loadImageFromFile(file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          if (event.target && event.target.result) {
            bgImage.src = event.target.result;
          }
        };
        reader.readAsDataURL(file);
      }

      /**
       * Berekent afmetingen van het hoofdcanvas en het maskercanvas.
       */
      function updateDimensions() {
        const rect = revealContainer.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(rect.width, 300);
        height = Math.max(rect.height, 200);

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        maskCanvas.width = Math.round(width);
        maskCanvas.height = Math.round(height);
      }

      /**
       * Past het schermvullende vuurwerkcanvas aan op de venstergrootte.
       */
      function resizeFireworksCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        fwWidth = window.innerWidth;
        fwHeight = window.innerHeight;
        fwCanvas.width = Math.round(fwWidth * dpr);
        fwCanvas.height = Math.round(fwHeight * dpr);
        fwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      /**
       * Bouwt een rijke, overlappende wolk van bubbels en hartjes netjes binnen het kader.
       */
      function setupReveal() {
        updateDimensions();
        isWon = false;
        bubbles = [];
        particles = [];
        rings = [];
        rockets = [];
        fwSparks = [];
        if (fireworkTimer) {
          clearInterval(fireworkTimer);
          fireworkTimer = null;
        }
        fwCtx.clearRect(0, 0, fwWidth, fwHeight);
        celebrationBannerEl.classList.add('hidden');

        // Veilige binnenmarge zodat geen enkele bubbel of hartje achter de kader valt
        const baseRadius = Math.max(20, Math.min(width, height) * 0.062);
        const pad = baseRadius * 0.85;
        const innerW = Math.max(width - pad * 2, baseRadius * 2);
        const innerH = Math.max(height - pad * 2, baseRadius * 2);

        const stepX = baseRadius * 1.25;
        const stepY = baseRadius * 1.18;

        const cols = Math.max(2, Math.round(innerW / stepX) + 1);
        const rows = Math.max(2, Math.round(innerH / stepY) + 1);
        const actualStepX = innerW / (cols - 1);
        const actualStepY = innerH / (rows - 1);

        let idCounter = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const jitterX = (Math.random() - 0.5) * baseRadius * 0.45;
            const jitterY = (Math.random() - 0.5) * baseRadius * 0.45;
            const rowOffset = (r % 2 === 1 && c < cols - 1) ? actualStepX * 0.35 : 0;

            const radius = baseRadius * (0.82 + Math.random() * 0.36);
            const minX = radius * 0.72;
            const maxX = width - radius * 0.72;
            const minY = radius * 0.72;
            const maxY = height - radius * 0.72;

            const bx = Math.min(maxX, Math.max(minX, pad + c * actualStepX + rowOffset + jitterX));
            const by = Math.min(maxY, Math.max(minY, pad + r * actualStepY + jitterY));

            const isHeart = Math.random() < 0.42; // ~42% hartjes, ~58% zeepbellen
            const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];

            bubbles.push({
              id: idCounter++,
              baseX: bx,
              baseY: by,
              x: bx,
              y: by,
              r: radius,
              type: isHeart ? 'heart' : 'bubble',
              palette,
              phase: Math.random() * Math.PI * 2,
              speed: 1.1 + Math.random() * 0.9,
              tilt: (Math.random() - 0.5) * 0.25,
              popped: false
            });
          }
        }

        // Hussel de tekenvolgorde voor natuurlijke diepte
        for (let i = bubbles.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [bubbles[i], bubbles[j]] = [bubbles[j], bubbles[i]];
        }
      }

      /**
       * Tekent een mooi symmetrisch hart-pad rond (0, 0) met straal r.
       */
      function traceHeartPath(context, r) {
        const s = r * 1.05;
        context.beginPath();
        context.moveTo(0, s * 0.85);
        context.bezierCurveTo(-s * 1.25, s * 0.05, -s * 1.15, -s * 0.95, 0, -s * 0.35);
        context.bezierCurveTo(s * 1.15, -s * 0.95, s * 1.25, s * 0.05, 0, s * 0.85);
        context.closePath();
      }

      /**
       * Tekent één glinsterende zeepbel of hartje op het canvas.
       */
      function drawBubbleOrHeart(b) {
        ctx.save();
        ctx.translate(b.x, b.y);

        if (b.type === 'heart') {
          ctx.rotate(b.tilt);

          // Zachte schaduw
          ctx.save();
          ctx.translate(1.5, 3);
          traceHeartPath(ctx, b.r);
          ctx.fillStyle = 'rgba(61, 46, 41, 0.14)';
          ctx.fill();
          ctx.restore();

          // Hartvulling met warm kleurverloop
          const grad = ctx.createRadialGradient(-b.r * 0.25, -b.r * 0.3, b.r * 0.1, 0, 0, b.r * 1.1);
          grad.addColorStop(0, '#FFF8F6');
          grad.addColorStop(0.35, b.palette.fill);
          grad.addColorStop(1, b.palette.glow);

          traceHeartPath(ctx, b.r);
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.lineWidth = 1.6;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.stroke();

          // Glanspuntje op het hartje
          ctx.beginPath();
          ctx.ellipse(-b.r * 0.35, -b.r * 0.32, b.r * 0.18, b.r * 0.1, -0.6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.fill();
        } else {
          // Zachte schaduw
          ctx.beginPath();
          ctx.arc(1.5, 3, b.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(61, 46, 41, 0.13)';
          ctx.fill();

          // Pareleffect zeepbel
          const grad = ctx.createRadialGradient(-b.r * 0.32, -b.r * 0.32, b.r * 0.08, 0, 0, b.r);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.92)');
          grad.addColorStop(0.55, b.palette.fill);
          grad.addColorStop(1, b.palette.glow);

          ctx.beginPath();
          ctx.arc(0, 0, b.r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.lineWidth = 1.6;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.stroke();

          // Glansboogje linksboven
          ctx.beginPath();
          ctx.ellipse(-b.r * 0.34, -b.r * 0.34, b.r * 0.26, b.r * 0.13, -Math.PI / 4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
          ctx.fill();
        }

        ctx.restore();
      }

      /**
       * Laat een bubbel of hartje uiteenspatten met glinsterende deeltjes.
       */
      function popBubble(b) {
        if (b.popped) return;
        b.popped = true;

        // Uitdijende schokgolf-ring
        rings.push({
          x: b.x,
          y: b.y,
          r: b.r * 0.4,
          maxR: b.r * 1.55,
          alpha: 0.85,
          color: b.palette.glow
        });

        // Spat-deeltjes (mini-hartjes en pareltjes)
        const count = 11;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
          const speed = 1.6 + Math.random() * 3.1;
          particles.push({
            x: b.x,
            y: b.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 0.6,
            size: Math.max(3, b.r * 0.17),
            alpha: 1,
            color: i % 2 === 0 ? b.palette.glow : '#FFFFFF',
            isMiniHeart: b.type === 'heart' && i % 3 === 0
          });
        }

        // Controleer of alle bubbels en hartjes weg zijn
        const remaining = bubbles.some((item) => !item.popped);
        if (!remaining) {
          triggerWin();
        }
      }

      /**
       * Prik bubbels/hartjes lek op coördinaat (px, py).
       */
      function popAtPoint(px, py) {
        if (isWon) return;

        // Zoek van boven naar beneden (laatst getekende eerst) met ruime klikstraal
        let poppedAny = false;
        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          if (b.popped) continue;
          const dist = Math.hypot(px - b.x, py - b.y);
          if (dist <= b.r * 1.25) {
            popBubble(b);
            poppedAny = true;
            break;
          }
        }
        return poppedAny;
      }

      /**
       * Viert de volledige onthulling met opstijgende vuurpijlen en grote vuurwerkboeketten.
       */
      function triggerWin() {
        if (isWon) return;
        isWon = true;
        celebrationBannerEl.classList.remove('hidden');

        // Direct een grote openingssalvo van 5 vuurpijlen tegelijk
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            launchRocket(0.15 + i * 0.175 + (Math.random() - 0.5) * 0.05);
          }, i * 160);
        }

        // Aanhoudende vuurwerkshow met meerdere vuurpijlen per salvo
        const showEnd = Date.now() + 9500;
        fireworkTimer = setInterval(() => {
          if (Date.now() > showEnd) {
            clearInterval(fireworkTimer);
            fireworkTimer = null;
            return;
          }
          const burstCount = 2 + Math.floor(Math.random() * 3);
          for (let i = 0; i < burstCount; i++) {
            setTimeout(() => {
              launchRocket(0.12 + Math.random() * 0.76);
            }, i * 180);
          }
        }, 650);
      }

      /**
       * Lanceert een vuurpijl vanaf onderaan het scherm naar een explosiehoogte.
       */
      function launchRocket(normX) {
        const palettes = [
          ['#FFD166', '#FFE8A3', '#FFFFFF', '#F4A261'], // Koningsgoud & warm oranje
          ['#FF6B6B', '#FFB4A2', '#FFD166', '#FFFFFF'], // Koraalrood & goud
          ['#F72585', '#FF85A1', '#FBB1BD', '#FFF0F3'], // Feestelijk magenta & roze
          ['#4CC9F0', '#90E0EF', '#FFFFFF', '#FFD166'], // Helder hemelsblauw & zilver
          ['#E0AAFF', '#C77DFF', '#FFD166', '#FFFFFF']  // Lichtgevend violet & goud
        ];
        const palette = palettes[Math.floor(Math.random() * palettes.length)];
        const startX = fwWidth * normX;
        const startY = fwHeight + 10;
        const targetY = fwHeight * (0.12 + Math.random() * 0.34);
        const vy = -Math.sqrt(2 * 0.22 * (startY - targetY));

        rockets.push({
          x: startX,
          y: startY,
          vx: (Math.random() - 0.5) * 2.4,
          vy,
          targetY,
          palette,
          trail: [],
          style: ['chrysanthemum', 'willow', 'doubleRing', 'heart'][Math.floor(Math.random() * 4)]
        });
      }

      /**
       * Laat een vuurpijl hoog in de lucht uiteenknallen in een groot boeket.
       */
      function explodeRocket(rocket) {
        const { x, y, palette, style } = rocket;

        // Felle lichtflits op het knalpunt
        fwSparks.push({
          x,
          y,
          vx: 0,
          vy: 0,
          alpha: 1,
          decay: 0.08,
          size: 28,
          color: '#FFFFFF',
          gravity: 0,
          drag: 1,
          isFlash: true,
          trail: []
        });

        if (style === 'heart') {
          const count = 75;
          for (let i = 0; i < count; i++) {
            const t = (Math.PI * 2 * i) / count;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            const scale = 0.28 + Math.random() * 0.05;
            fwSparks.push({
              x,
              y,
              vx: hx * scale,
              vy: hy * scale,
              alpha: 1,
              decay: 0.013 + Math.random() * 0.006,
              size: 2.6,
              color: palette[i % palette.length],
              gravity: 0.04,
              drag: 0.96,
              twinkle: true,
              trail: []
            });
          }
          return;
        }

        const count = style === 'willow' ? 110 : 95;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.08;
          let speed = 2.2 + Math.random() * 5.2;
          if (style === 'doubleRing') {
            speed = i % 2 === 0 ? 5.6 + Math.random() * 0.8 : 3.0 + Math.random() * 0.6;
          } else if (style === 'willow') {
            speed = 1.8 + Math.random() * 4.5;
          }

          fwSparks.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            decay: style === 'willow' ? 0.009 + Math.random() * 0.005 : 0.013 + Math.random() * 0.007,
            size: style === 'willow' ? 2.2 : 2.6,
            color: palette[Math.floor(Math.random() * palette.length)],
            gravity: style === 'willow' ? 0.085 : 0.055,
            drag: style === 'willow' ? 0.955 : 0.965,
            twinkle: Math.random() < 0.45,
            trail: []
          });
        }
      }

      /**
       * Update de zachte zweefbeweging van de bubbels en houdt ze altijd klikbaar binnen het kader.
       */
      function update(now) {
        const t = (now - startTime) * 0.001;

        for (const b of bubbles) {
          if (b.popped) continue;
          const rawX = b.baseX + Math.sin(t * b.speed + b.phase) * 3.0;
          const rawY = b.baseY + Math.cos(t * (b.speed * 0.85) + b.phase) * 2.6;
          const margin = b.r * 0.65;
          b.x = Math.min(width - margin, Math.max(margin, rawX));
          b.y = Math.min(height - margin, Math.max(margin, rawY));
        }

        for (let i = rings.length - 1; i >= 0; i--) {
          const ring = rings[i];
          ring.r += (ring.maxR - ring.r) * 0.22;
          ring.alpha -= 0.055;
          if (ring.alpha <= 0) {
            rings.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.12;
          p.alpha -= 0.032;
          if (p.alpha <= 0) {
            particles.splice(i, 1);
          }
        }

        // Update opstijgende vuurpijlen
        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.trail.push({ x: r.x, y: r.y });
          if (r.trail.length > 10) r.trail.shift();

          r.x += r.vx;
          r.y += r.vy;
          r.vy += 0.22;

          // Kleine gloeiende vonkjes uit de staart
          if (Math.random() < 0.7) {
            fwSparks.push({
              x: r.x + (Math.random() - 0.5) * 3,
              y: r.y + 4,
              vx: (Math.random() - 0.5) * 0.8,
              vy: 0.8 + Math.random() * 1.2,
              alpha: 0.85,
              decay: 0.045,
              size: 1.6,
              color: '#FFE8A3',
              gravity: 0.04,
              drag: 0.96,
              twinkle: false,
              trail: []
            });
          }

          if (r.vy >= -0.6 || r.y <= r.targetY) {
            explodeRocket(r);
            rockets.splice(i, 1);
          }
        }

        // Update vuurwerkboeketten
        for (let i = fwSparks.length - 1; i >= 0; i--) {
          const s = fwSparks[i];
          if (!s.isFlash) {
            s.trail.push({ x: s.x, y: s.y });
            if (s.trail.length > 6) s.trail.shift();
          }

          s.vx *= s.drag;
          s.vy = s.vy * s.drag + s.gravity;
          s.x += s.vx;
          s.y += s.vy;
          s.alpha -= s.decay;

          if (s.alpha <= 0) {
            fwSparks.splice(i, 1);
          }
        }
      }

      /**
       * Tekent het hele beeld: onderliggende foto + mistlaag waar bubbels nog hangen + bubbels/hartjes.
       */
      function render() {
        ctx.clearRect(0, 0, width, height);

        // 1. Onderliggende Save the Date foto
        if (imageLoaded) {
          ctx.drawImage(bgImage, 0, 0, width, height);
        }

        // 2. Zachte sluier op plekken waar nog ongepopte bubbels hangen (zodat de foto spannend verborgen blijft)
        if (!isWon) {
          maskCtx.clearRect(0, 0, width, height);
          maskCtx.fillStyle = '#EFE6DC';

          for (const b of bubbles) {
            if (b.popped) continue;
            maskCtx.beginPath();
            maskCtx.arc(b.x, b.y, b.r * 1.18, 0, Math.PI * 2);
            maskCtx.fill();
          }

          ctx.save();
          ctx.globalAlpha = 0.92;
          ctx.drawImage(maskCanvas, 0, 0, width, height);
          ctx.restore();
        }

        // 3. Zwevende zeepbellen en hartjes
        for (const b of bubbles) {
          if (b.popped) continue;
          drawBubbleOrHeart(b);
        }

        // 4. Uitdijende schokgolfjes
        for (const ring of rings) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, ring.alpha);
          ctx.beginPath();
          ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
          ctx.lineWidth = 2;
          ctx.strokeStyle = ring.color;
          ctx.stroke();
          ctx.restore();
        }

        // 5. Spat-deeltjes
        for (const p of particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.translate(p.x, p.y);
          ctx.fillStyle = p.color;

          if (p.isMiniHeart) {
            traceHeartPath(ctx, p.size);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        renderFireworks();
      }

      /**
       * Tekent de opstijgende vuurpijlen en gloeiende vuurwerkboeketten op het bovenste canvas.
       */
      function renderFireworks() {
        fwCtx.clearRect(0, 0, fwWidth, fwHeight);
        if (rockets.length === 0 && fwSparks.length === 0) return;

        fwCtx.save();
        fwCtx.globalCompositeOperation = 'lighter';

        for (const r of rockets) {
          for (let i = 0; i < r.trail.length; i++) {
            const pt = r.trail[i];
            const ratio = (i + 1) / r.trail.length;
            fwCtx.beginPath();
            fwCtx.arc(pt.x, pt.y, 2.4 * ratio, 0, Math.PI * 2);
            fwCtx.fillStyle = `rgba(255, 225, 150, ${ratio * 0.85})`;
            fwCtx.fill();
          }
          fwCtx.beginPath();
          fwCtx.arc(r.x, r.y, 3.2, 0, Math.PI * 2);
          fwCtx.fillStyle = '#FFFFFF';
          fwCtx.fill();
        }

        for (const s of fwSparks) {
          const alpha = Math.max(0, s.alpha);
          if (s.isFlash) {
            const grad = fwCtx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size);
            grad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
            grad.addColorStop(0.5, `rgba(255, 220, 140, ${alpha * 0.5})`);
            grad.addColorStop(1, 'rgba(255, 200, 100, 0)');
            fwCtx.fillStyle = grad;
            fwCtx.beginPath();
            fwCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            fwCtx.fill();
            continue;
          }

          if (s.trail.length > 1) {
            fwCtx.beginPath();
            fwCtx.moveTo(s.trail[0].x, s.trail[0].y);
            for (let i = 1; i < s.trail.length; i++) {
              fwCtx.lineTo(s.trail[i].x, s.trail[i].y);
            }
            fwCtx.lineTo(s.x, s.y);
            fwCtx.strokeStyle = s.color;
            fwCtx.globalAlpha = alpha * 0.45;
            fwCtx.lineWidth = s.size * 0.8;
            fwCtx.stroke();
          }

          const flicker = s.twinkle ? (0.55 + Math.random() * 0.45) : 1;
          fwCtx.globalAlpha = alpha * flicker;
          fwCtx.beginPath();
          fwCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          fwCtx.fillStyle = s.color;
          fwCtx.fill();
        }

        fwCtx.restore();
      }

      /**
       * Hoofdlus.
       */
      function loop(now = performance.now()) {
        update(now);
        render();
        animFrameId = requestAnimationFrame(loop);
      }

      /**
       * Converteert pointer-event naar canvas-coördinaten.
       */
      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      /**
       * Koppelt tik-, veeg- en venster-events.
       */
      function bindEvents() {
        canvas.addEventListener('pointerdown', (e) => {
          isPointerDown = true;
          const pos = getCanvasCoords(e.clientX, e.clientY);
          popAtPoint(pos.x, pos.y);
        });

        canvas.addEventListener('pointermove', (e) => {
          if (!isPointerDown) return;
          const pos = getCanvasCoords(e.clientX, e.clientY);
          popAtPoint(pos.x, pos.y);
        });

        window.addEventListener('pointerup', () => {
          isPointerDown = false;
        });

        playAgainBtn.addEventListener('click', setupReveal);

        let resizeTimer;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            resizeFireworksCanvas();
            if (imageLoaded && !isWon) {
              setupReveal();
            } else if (imageLoaded) {
              updateDimensions();
            }
          }, 150);
        });
      }

      init();
    })();
  </script>
</body>
